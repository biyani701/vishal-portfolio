<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- All three faces appear above the fold on every page (headings; the serif lede, usually the largest element;
         mono labels), so each latin file loads from the start rather than once CSS has been parsed and laid out.
         Italic and latin-ext files still load on first use (src/design/fonts.css). -->
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // No-flash theme (design.md A3): resolve the saved preference (themeMode cookie, then local storage,
      // as the theme control in P3.4 writes them) or else the OS scheme, before any CSS paints.
      ;(function () {
        var pref
        try {
          var match = document.cookie.match(/(?:^|;\s*)themeMode=(light|dark|system)\b/)
          pref = match ? match[1] : localStorage.getItem('themeMode')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- No <title> or description here: each page renders its own (src/layout/PageMeta.tsx), which React hoists into
         <head>, and the build prerenders them into each page's HTML. A static one would be duplicated. -->
    <!-- Deferred so it doesn't block the first paint; deferred and module scripts run in document order, so it still
         sets window.runtimeConfig before the app's module script below. -->
    <script defer src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
