<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing you in…</title>
    <!-- Preserved auth-server contract path (specs/auth-integration). The app's /auth-callback route reads the
         session and returns the visitor to where they started; this page only hands over the query string. -->
    <script>
      location.replace('/auth-callback' + location.search + location.hash)
    </script>
  </head>
  <body>
    <p>Signing you in… <a href="/auth-callback">Continue</a></p>
  </body>
</html>
