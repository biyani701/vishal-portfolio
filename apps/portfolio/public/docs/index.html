<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portfolio Documentation</title>
  <meta http-equiv="refresh" content="0;url=/docs/">
  <script>
    // This script handles routing for the docs directory
    (function() {
      console.log('📚 Docs index.html loaded');
      
      // Redirect to the actual docs site
      window.location.href = '/docs/';
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f6f7;
      color: #1c1e21;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #2e8555;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portfolio Documentation</h1>
    <p>Redirecting to documentation site...</p>
    <div class="loading"></div>
  </div>
</body>
</html>
