    <script>
      // No-flash theme: the visitor's saved choice (src/theme-toggle.ts), or else the system theme, before CSS paints.
      ;(function () {
        var pref
        try {
          pref = localStorage.getItem('themeMode')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <script type="module" src="/src/theme-toggle.ts"></script>
