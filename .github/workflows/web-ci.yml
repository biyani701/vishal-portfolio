name: Web CI

# Quality gates for apps/web (specs/web-platform "Quality gates"), a Vercel preview per PR, and on main the
# production deploy to GitHub Pages at vishal.biyani.xyz followed by the smoke test (task 14.2; apps/web/DEPLOY.md).
# Rollback: re-run an earlier good main run (DEPLOY.md "Rollback").
on:
  pull_request:
    branches: [main]
    paths: &web-paths
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths: *web-paths

concurrency:
  group: web-ci-${{ github.ref }}
  # A new PR push supersedes the old run; runs on main queue instead, so a deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Public build configuration (never secrets). Override with repository variables.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.vishal.biyani.xyz' }}

jobs:
  checks:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install apps/web dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter web

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Chromium runs both the src/ui contract tests (Vitest browser mode) and the Playwright matrix.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and contract tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pull requests also save a full-page screenshot per route × viewport × theme (task 12.1).
      - name: Playwright viewport matrix
        run: pnpm e2e
        env:
          MATRIX_SCREENSHOTS: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Upload matrix screenshots
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-screenshots
          path: apps/web/matrix-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

      # The same tested build, packaged for Pages. Kept 90 days, so an earlier run's deploy can be re-run to roll back.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time across runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  smoke:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install apps/web dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter web

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test vishal.biyani.xyz
        run: pnpm smoke
        env:
          SMOKE_BASE_URL: https://vishal.biyani.xyz
          SMOKE_API_URL: ${{ env.VITE_API_BASE_URL }}

  preview:
    name: Vercel preview
    needs: checks
    # Forks don't get the Vercel secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning title=Vercel preview skipped::Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to enable previews."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .vercel/output/static

      # Deploy the tested build as-is (Build Output API v3). /work is served from the prerendered work.html (as GitHub
      # Pages does); everything else falls back to the untouched app shell (app.html), not to the prerendered Home.
      - name: Deploy to Vercel
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          cat > .vercel/output/config.json <<'JSON'
          { "version": 3, "routes": [{ "handle": "filesystem" }, { "src": "^/(.*[^/])$", "dest": "/$1.html", "check": true }, { "src": "/.*", "dest": "/app.html" }] }
          JSON
          url=$(npx --yes vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "**apps/web preview:** $URL (built from $SHA)"
